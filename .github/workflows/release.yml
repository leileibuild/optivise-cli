name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing
        run: npm install --global 'npm@^11.5.1'
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm run test:skill
      - name: Check tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: mkdir -p release && npm pack --pack-destination release
      - run: sha256sum release/*.tgz > release/SHA256SUMS
      - run: npm sbom --sbom-format cyclonedx > release/sbom.cdx.json
      - run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS release/sbom.cdx.json --generate-notes --title "Optivise CLI ${GITHUB_REF_NAME#v}"
