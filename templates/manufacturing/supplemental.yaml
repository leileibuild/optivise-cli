time:
  epoch: "2022-07-01"
  unit: days
  horizon_buffer_days: 14

workshops:
  贴片车间:
    default_machine: SMT-1
    machines: [SMT-1]
  组装车间:
    default_machine: ASM-1
    machines: [ASM-1, ASM-2]
  包装车间:
    default_machine: PKG-1
    machines: [PKG-1]

solver:
  max_time_in_seconds: 30
  num_workers: 4

constraints:
  precedence:
    enabled: true
  machine_no_overlap:
    enabled: true

objectives:
  makespan:
    enabled: true
    weight: 1.0

custom_terms:
  weighted_tardiness:
    enabled: false
    weight: 1.0

terms:
  enable_tardiness: false
  enable_makespan: true
